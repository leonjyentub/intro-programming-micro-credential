<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="305" viewBox="0 0 1180 305" role="img" aria-labelledby="title desc">
  <title id="title">從使用者需求到行動服務的產品開發流程</title>
  <desc id="desc">使用者需求經由網頁與使用者介面、網站應用程式、資料庫管理，延伸到行動應用服務。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5D88AA"/></marker>
    <filter id="shadow" x="-9%" y="-15%" width="118%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A4A7A" flood-opacity="0.12"/></filter>
  </defs>

  <!-- Product flow connectors -->
  <g fill="none" stroke="#5D88AA" stroke-width="3" marker-end="url(#arrow)">
    <path d="M230 108 H247"/>
    <path d="M457 108 H474"/>
    <path d="M684 108 H701"/>
    <path d="M911 108 H928"/>
  </g>

  <!-- 1 Discover -->
  <g filter="url(#shadow)">
    <rect x="20" y="24" width="210" height="171" rx="15" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/>
    <rect x="20" y="24" width="210" height="42" rx="15" fill="#0A4A7A"/>
    <path d="M20 50 H230 V66 H20 Z" fill="#0A4A7A"/>
    <text x="131" y="51" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15" letter-spacing="1">DISCOVER</text>
    <circle cx="57" cy="96" r="18" fill="#0A4A7A" opacity="0.12"/>
    <path d="M48 90 H66 V103 H57 L51 109 V103 H48 Z" fill="none" stroke="#0A4A7A" stroke-width="2" stroke-linejoin="round"/>
    <text x="82" y="98" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">使用者需求</text>
    <text x="131" y="137" text-anchor="middle" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16">問題、情境與價值</text>
    <text x="131" y="162" text-anchor="middle" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">要替誰解決什麼？</text>
  </g>

  <!-- 2 Design -->
  <g filter="url(#shadow)">
    <rect x="247" y="24" width="210" height="171" rx="15" fill="#FFF8E9" stroke="#E6B34C" stroke-width="1.5"/>
    <rect x="247" y="24" width="210" height="42" rx="15" fill="#D4631D"/>
    <path d="M247 50 H457 V66 H247 Z" fill="#D4631D"/>
    <text x="358" y="51" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15" letter-spacing="1">DESIGN</text>
    <circle cx="284" cy="96" r="18" fill="#D4631D" opacity="0.12"/>
    <rect x="275" y="86" width="18" height="14" rx="2" fill="none" stroke="#A94712" stroke-width="2"/>
    <path d="M279 105 H289" stroke="#A94712" stroke-width="2" stroke-linecap="round"/>
    <text x="309" y="91" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">網頁設計／UI</text>
    <text x="309" y="113" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">使用者介面</text>
    <text x="358" y="151" text-anchor="middle" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16">看得懂、用得順</text>
    <text x="358" y="174" text-anchor="middle" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">讓操作有明確回饋</text>
  </g>

  <!-- 3 Build -->
  <g filter="url(#shadow)">
    <rect x="474" y="24" width="210" height="171" rx="15" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/>
    <rect x="474" y="24" width="210" height="42" rx="15" fill="#0A4A7A"/>
    <path d="M474 50 H684 V66 H474 Z" fill="#0A4A7A"/>
    <text x="585" y="51" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15" letter-spacing="1">BUILD</text>
    <circle cx="511" cy="96" r="18" fill="#0A4A7A" opacity="0.12"/>
    <path d="M503 90 L510 96 L503 102 M519 90 L512 96 L519 102" fill="none" stroke="#0A4A7A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="536" y="98" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">網站應用程式</text>
    <text x="585" y="137" text-anchor="middle" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16">帳號、規則與流程</text>
    <text x="585" y="162" text-anchor="middle" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">讓畫面真正能做事</text>
  </g>

  <!-- 4 Data -->
  <g filter="url(#shadow)">
    <rect x="701" y="24" width="210" height="171" rx="15" fill="#FFF8E9" stroke="#E6B34C" stroke-width="1.5"/>
    <rect x="701" y="24" width="210" height="42" rx="15" fill="#D4631D"/>
    <path d="M701 50 H911 V66 H701 Z" fill="#D4631D"/>
    <text x="812" y="51" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15" letter-spacing="1">DATA</text>
    <ellipse cx="738" cy="88" rx="14" ry="5" fill="#D4631D" opacity="0.85"/>
    <path d="M724 88 V106 C724 112 752 112 752 106 V88" fill="#D4631D" opacity="0.85"/>
    <ellipse cx="738" cy="106" rx="14" ry="5" fill="#D4631D" opacity="0.85"/>
    <text x="763" y="98" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">資料庫管理</text>
    <text x="812" y="137" text-anchor="middle" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16">保存、查詢與分析</text>
    <text x="812" y="162" text-anchor="middle" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">讓資料成為資產</text>
  </g>

  <!-- 5 Mobile -->
  <g filter="url(#shadow)">
    <rect x="928" y="24" width="210" height="171" rx="15" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/>
    <rect x="928" y="24" width="210" height="42" rx="15" fill="#0A4A7A"/>
    <path d="M928 50 H1138 V66 H928 Z" fill="#0A4A7A"/>
    <text x="1039" y="51" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15" letter-spacing="1">MOBILE</text>
    <circle cx="965" cy="96" r="18" fill="#0A4A7A" opacity="0.12"/>
    <rect x="958" y="84" width="14" height="24" rx="3" fill="none" stroke="#0A4A7A" stroke-width="2"/>
    <circle cx="965" cy="103" r="1.7" fill="#0A4A7A"/>
    <text x="990" y="91" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">行動應用開發</text>
    <text x="990" y="113" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700">／程式設計</text>
    <text x="1039" y="151" text-anchor="middle" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16">手機情境與即時提醒</text>
    <text x="1039" y="174" text-anchor="middle" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">把服務帶到使用者身邊</text>
  </g>

  <!-- Shared service core: deliberately enlarged for classroom readability -->
  <g filter="url(#shadow)">
    <rect x="20" y="209" width="1130" height="76" rx="12" fill="#162F49"/>
    <rect x="20" y="209" width="16" height="76" rx="8" fill="#F2B134"/>
    <text x="585" y="242" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="28" font-weight="700">同一套帳號・同一套規則・同一份資料</text>
    <text x="585" y="270" text-anchor="middle" fill="#DCEAF4" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="600">網頁與手機共用同一個可信服務，使用者能從不同入口接續完成任務</text>
  </g>
</svg>
