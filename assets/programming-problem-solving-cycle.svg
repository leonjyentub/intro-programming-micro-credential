<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">程式設計的核心循環</title>
  <desc id="desc">以兩列六個步驟呈現從讀題、推演、實作、執行、除錯到紀錄的程式設計核心循環。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5D88AA"/></marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="132%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A4A7A" flood-opacity="0.12"/></filter>
  </defs>
  <g fill="none" stroke="#5D88AA" stroke-width="3.2" marker-end="url(#arrow)">
    <path d="M366 94 H403"/><path d="M757 94 H794"/><path d="M952 159 V207"/><path d="M794 272 H757"/><path d="M403 272 H366"/>
  </g>
  <path d="M203 337 C66 337 66 181 203 181" fill="none" stroke="#A0B7C9" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="112" y="195" text-anchor="middle" fill="#647D96" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" font-weight="600">下一題再用</text>
  <g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" filter="url(#shadow)">
    <g><rect x="34" y="26" width="332" height="136" rx="16" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/><circle cx="73" cy="67" r="22" fill="#0A4A7A"/><text x="73" y="74" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">1</text><text x="102" y="71" fill="#0A4A7A" font-size="23" font-weight="700">讀題：看懂問題</text><text x="200" y="112" text-anchor="middle" fill="#34506B" font-size="18">圈出輸入、輸出、限制與例子</text><text x="200" y="140" text-anchor="middle" fill="#34506B" font-size="18">先問：電腦到底要完成什麼？</text></g>
    <g><rect x="403" y="26" width="354" height="136" rx="16" fill="#FFF8E9" stroke="#E6B34C" stroke-width="1.5"/><circle cx="442" cy="67" r="22" fill="#D4631D"/><text x="442" y="74" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">2</text><text x="472" y="71" fill="#A94712" font-size="23" font-weight="700">推演：自己先走一次</text><text x="580" y="112" text-anchor="middle" fill="#66513A" font-size="18">用小數字驗證步驟是否合理</text><text x="580" y="140" text-anchor="middle" fill="#66513A" font-size="18">把想法拆成能逐一完成的動作</text></g>
    <g><rect x="794" y="26" width="352" height="136" rx="16" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/><circle cx="833" cy="67" r="22" fill="#0A4A7A"/><text x="833" y="74" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">3</text><text x="863" y="71" fill="#0A4A7A" font-size="23" font-weight="700">實作：寫出最小版本</text><text x="970" y="112" text-anchor="middle" fill="#34506B" font-size="18">先讓一個正確例子能執行</text><text x="970" y="140" text-anchor="middle" fill="#34506B" font-size="18">再逐步加入條件、迴圈與函式</text></g>
    <g><rect x="794" y="207" width="352" height="136" rx="16" fill="#FFF8E9" stroke="#E6B34C" stroke-width="1.5"/><circle cx="833" cy="248" r="22" fill="#D4631D"/><text x="833" y="255" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">4</text><text x="863" y="252" fill="#A94712" font-size="23" font-weight="700">執行：比較結果</text><text x="970" y="293" text-anchor="middle" fill="#66513A" font-size="18">正常資料與邊界資料都要試</text><text x="970" y="321" text-anchor="middle" fill="#66513A" font-size="18">結果和預期不同，就是線索</text></g>
    <g><rect x="403" y="207" width="354" height="136" rx="16" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/><circle cx="442" cy="248" r="22" fill="#0A4A7A"/><text x="442" y="255" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">5</text><text x="472" y="252" fill="#0A4A7A" font-size="23" font-weight="700">除錯：找出差異</text><text x="580" y="293" text-anchor="middle" fill="#34506B" font-size="18">讀錯誤訊息、縮小問題範圍</text><text x="580" y="321" text-anchor="middle" fill="#34506B" font-size="18">一次修正一個可驗證的原因</text></g>
    <g><rect x="34" y="207" width="332" height="136" rx="16" fill="#FFF8E9" stroke="#E6B34C" stroke-width="1.5"/><circle cx="73" cy="248" r="22" fill="#D4631D"/><text x="73" y="255" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">6</text><text x="103" y="252" fill="#A94712" font-size="23" font-weight="700">紀錄：留下版本</text><text x="200" y="293" text-anchor="middle" fill="#66513A" font-size="18">寫下怎麼解決、為何這樣修改</text><text x="200" y="321" text-anchor="middle" fill="#66513A" font-size="18">讓下一題的自己走得更快</text></g>
  </g>
</svg>
