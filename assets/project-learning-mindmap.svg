<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">從程式設計基礎到專案實作的學習心智圖</title>
  <desc id="desc">程式設計基礎、資料結構、網站或行動應用、商業邏輯與 UI UX，最後匯整為專案實作能力。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7A99B6"/>
    </marker>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A4A7A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- all arrows converge on the project, placed first to remain behind cards -->
  <g fill="none" stroke="#7A99B6" stroke-width="3" marker-end="url(#arrow)">
    <path d="M290 68 C375 68 405 103 478 130"/>
    <path d="M290 291 C375 291 408 251 478 218"/>
    <path d="M890 68 C805 68 775 103 702 130"/>
    <path d="M920 180 C825 180 772 180 720 180"/>
    <path d="M890 291 C805 291 775 251 702 218"/>
  </g>

  <!-- central project destination -->
  <g filter="url(#shadow)">
    <circle cx="590" cy="180" r="130" fill="#0A4A7A"/>
    <circle cx="590" cy="180" r="109" fill="none" stroke="#5E9BC8" stroke-width="2"/>
    <path d="M540 136 H640 V194 H540 Z" fill="#EAF4FB" opacity="0.96"/>
    <path d="M555 151 H625 M555 164 H610 M555 177 H620" fill="none" stroke="#75A4C6" stroke-width="6" stroke-linecap="round"/>
    <text x="590" y="224" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="700">專案實作</text>
    <text x="590" y="249" text-anchor="middle" fill="#DCEAF4" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">需求 → 設計 → 開發 → 測試</text>
  </g>

  <!-- Programming fundamentals -->
  <g filter="url(#shadow)">
    <rect x="30" y="25" width="260" height="86" rx="14" fill="#EAF4FB" stroke="#76A7CA"/>
    <circle cx="63" cy="68" r="19" fill="#0A4A7A"/>
    <text x="63" y="72" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11.5" font-weight="700">&lt;/&gt;</text>
    <text x="94" y="60" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700">程式設計基礎</text>
    <text x="94" y="84" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">條件、迴圈、函式、物件</text>
  </g>

  <!-- data structures -->
  <g filter="url(#shadow)">
    <rect x="30" y="248" width="260" height="86" rx="14" fill="#FFF8E9" stroke="#E6B34C"/>
    <circle cx="63" cy="291" r="19" fill="#D4631D"/>
    <path d="M55 283 H71 V299 H55 Z M58 286 H68 M58 291 H68 M58 296 H68" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <text x="94" y="283" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700">資料結構</text>
    <text x="94" y="307" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">集合、搜尋、排序、效率</text>
  </g>

  <!-- application -->
  <g filter="url(#shadow)">
    <rect x="890" y="25" width="260" height="86" rx="14" fill="#EAF4FB" stroke="#76A7CA"/>
    <circle cx="923" cy="68" r="19" fill="#0A4A7A"/>
    <rect x="912" y="57" width="22" height="17" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M917 78 H929" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="954" y="60" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">網站／行動應用</text>
    <text x="954" y="84" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">頁面、API、手機情境</text>
  </g>

  <!-- business logic -->
  <g filter="url(#shadow)">
    <rect x="920" y="137" width="230" height="86" rx="14" fill="#FFF8E9" stroke="#E6B34C"/>
    <circle cx="953" cy="180" r="19" fill="#D4631D"/>
    <path d="M945 180 H961 M953 172 V188 M946 173 L960 187 M960 173 L946 187" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="984" y="172" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">商業邏輯</text>
    <text x="984" y="196" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">訂單、物流、權限、流程</text>
  </g>

  <!-- UI UX -->
  <g filter="url(#shadow)">
    <rect x="890" y="248" width="260" height="86" rx="14" fill="#EAF4FB" stroke="#76A7CA"/>
    <circle cx="923" cy="291" r="19" fill="#0A4A7A"/>
    <path d="M914 283 H932 V296 H922 L916 301 V296 H914 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <text x="954" y="283" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700">UI／UX 設計</text>
    <text x="954" y="307" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">介面、操作流程、使用回饋</text>
  </g>
</svg>
