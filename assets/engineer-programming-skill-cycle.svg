<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="280" viewBox="0 0 1180 280" role="img" aria-labelledby="title desc">
  <title id="title">工程師學會寫程式的能力循環</title>
  <desc id="desc">理解問題、設計資料與步驟、用程式表達、測試除錯，以及閱讀文件持續改善，構成工程師的解題循環。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6A92B2"/></marker>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="145%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A4A7A" flood-opacity="0.14"/></filter>
  </defs>

  <!-- outer engineering loop, placed before nodes -->
  <g fill="none" stroke="#6A92B2" stroke-width="3" marker-end="url(#arrow)">
    <path d="M730 28 C790 28 828 58 875 82"/>
    <path d="M1005 115 V165"/>
    <path d="M875 195 C820 250 770 253 730 252"/>
    <path d="M450 252 C355 252 305 203 285 140"/>
    <path d="M285 140 C314 75 370 35 450 28"/>
  </g>

  <!-- central idea -->
  <g filter="url(#shadow)">
    <circle cx="590" cy="140" r="82" fill="#0A4A7A"/>
    <circle cx="590" cy="140" r="67" fill="none" stroke="#71A7CF" stroke-width="2"/>
    <path d="M560 105 H620 V145 H560 Z" fill="#EAF4FB"/>
    <path d="M572 116 L580 124 L572 132 M608 116 L600 124 L608 132" fill="none" stroke="#0A4A7A" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="590" y="172" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="700">學會寫程式</text>
    <text x="590" y="193" text-anchor="middle" fill="#DCEAF4" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="14">工程師的解題循環</text>
  </g>

  <!-- 1 understand -->
  <g filter="url(#shadow)">
    <rect x="450" y="0" width="280" height="56" rx="14" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/>
    <circle cx="481" cy="28" r="17" fill="#0A4A7A"/>
    <text x="481" y="34" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">1</text>
    <text x="510" y="24" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">看懂問題與限制</text>
    <text x="510" y="44" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="14">需求、輸入、輸出與限制</text>
  </g>

  <!-- 2 design -->
  <g filter="url(#shadow)">
    <rect x="875" y="55" width="260" height="60" rx="14" fill="#FFF8E9" stroke="#E6B34C" stroke-width="1.5"/>
    <circle cx="906" cy="85" r="17" fill="#D4631D"/>
    <text x="906" y="91" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">2</text>
    <text x="935" y="81" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">設計資料與步驟</text>
    <text x="935" y="102" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="14">資料結構、流程拆解</text>
  </g>

  <!-- 3 implement -->
  <g filter="url(#shadow)">
    <rect x="875" y="165" width="260" height="60" rx="14" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/>
    <circle cx="906" cy="195" r="17" fill="#0A4A7A"/>
    <text x="906" y="201" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">3</text>
    <text x="935" y="191" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">用程式清楚表達</text>
    <text x="935" y="212" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="14">語言、函式與程式結構</text>
  </g>

  <!-- 4 verify -->
  <g filter="url(#shadow)">
    <rect x="450" y="224" width="280" height="56" rx="14" fill="#FFF8E9" stroke="#E6B34C" stroke-width="1.5"/>
    <circle cx="481" cy="252" r="17" fill="#D4631D"/>
    <text x="481" y="258" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">4</text>
    <text x="510" y="248" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">執行、測試、除錯</text>
    <text x="510" y="268" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="14">測資、證據與修正</text>
  </g>

  <!-- 5 improve -->
  <g filter="url(#shadow)">
    <rect x="25" y="110" width="260" height="60" rx="14" fill="#EAF4FB" stroke="#76A7CA" stroke-width="1.5"/>
    <circle cx="56" cy="140" r="17" fill="#0A4A7A"/>
    <text x="56" y="146" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">5</text>
    <text x="85" y="136" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700">閱讀並持續改善</text>
    <text x="85" y="157" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="14">文件、既有程式與回饋</text>
  </g>
</svg>
