<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" role="img" aria-labelledby="title desc">
  <title id="title">迎新活動報名服務的跨課程學習地圖</title>
  <desc id="desc">網頁設計、使用者介面、網站應用程式、資料庫管理與行動應用，共同完成迎新活動報名服務。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7A99B6"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A4A7A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- connectors first, so they sit behind the learning-area cards -->
  <g fill="none" stroke="#7A99B6" stroke-width="3" marker-end="url(#arrow)">
    <path d="M240 43 C350 43 385 102 480 132"/>
    <path d="M240 168 C350 168 385 170 480 170"/>
    <path d="M940 43 C830 43 795 102 700 132"/>
    <path d="M940 168 C830 168 795 170 700 170"/>
    <path d="M590 260 L590 246"/>
  </g>

  <!-- central product -->
  <g filter="url(#shadow)">
    <rect x="480" y="98" width="220" height="148" rx="18" fill="#0A4A7A"/>
    <rect x="502" y="117" width="176" height="70" rx="9" fill="#EAF4FB"/>
    <circle cx="523" cy="137" r="8" fill="#F2B134"/>
    <rect x="540" y="130" width="105" height="8" rx="4" fill="#0A4A7A" opacity="0.82"/>
    <rect x="517" y="153" width="145" height="7" rx="3.5" fill="#9DB8CF"/>
    <rect x="517" y="169" width="90" height="7" rx="3.5" fill="#9DB8CF"/>
    <text x="590" y="212" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700">迎新活動報名服務</text>
    <text x="590" y="231" text-anchor="middle" fill="#DCEAF4" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="14">同一個作品，整合五門能力</text>
  </g>

  <!-- web design -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="230" height="66" rx="12" fill="#EAF4FB" stroke="#76A7CA"/>
    <circle cx="38" cy="43" r="16" fill="#0A4A7A"/>
    <text x="38" y="49" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">1</text>
    <text x="63" y="36" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">網頁設計</text>
    <text x="63" y="59" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">活動介紹、報名畫面</text>
  </g>

  <!-- UI -->
  <g filter="url(#shadow)">
    <rect x="10" y="135" width="230" height="66" rx="12" fill="#FFF8E9" stroke="#E6B34C"/>
    <circle cx="38" cy="168" r="16" fill="#D4631D"/>
    <text x="38" y="174" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">2</text>
    <text x="63" y="161" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">使用者介面</text>
    <text x="63" y="184" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">下一步指引、錯誤提示</text>
  </g>

  <!-- web application -->
  <g filter="url(#shadow)">
    <rect x="940" y="10" width="230" height="66" rx="12" fill="#EAF4FB" stroke="#76A7CA"/>
    <circle cx="968" cy="43" r="16" fill="#0A4A7A"/>
    <text x="968" y="49" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">3</text>
    <text x="993" y="36" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">網站應用程式</text>
    <text x="993" y="59" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">身分、表單、名額規則</text>
  </g>

  <!-- database -->
  <g filter="url(#shadow)">
    <rect x="940" y="135" width="230" height="66" rx="12" fill="#FFF8E9" stroke="#E6B34C"/>
    <circle cx="968" cy="168" r="16" fill="#D4631D"/>
    <text x="968" y="174" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">4</text>
    <text x="993" y="161" fill="#A94712" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">資料庫管理</text>
    <text x="993" y="184" fill="#66513A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">活動、名額、報名紀錄</text>
  </g>

  <!-- mobile application -->
  <g filter="url(#shadow)">
    <rect x="440" y="260" width="300" height="66" rx="12" fill="#EAF4FB" stroke="#76A7CA"/>
    <circle cx="469" cy="293" r="16" fill="#0A4A7A"/>
    <text x="469" y="299" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">5</text>
    <text x="494" y="286" fill="#0A4A7A" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700">行動應用</text>
    <text x="494" y="309" fill="#34506B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15">手機查看狀態、接收提醒</text>
  </g>
</svg>
