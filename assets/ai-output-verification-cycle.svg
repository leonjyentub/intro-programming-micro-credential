<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="230" viewBox="0 0 1180 230" role="img" aria-labelledby="title desc">
  <title id="title">AI 產出後的驗證循環</title>
  <desc id="desc">讀需求、提出計畫、檢視差異、執行測試、自己解釋，再保留確認過的 Git 版本。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#648CAE"/></marker><filter id="shadow" x="-8%" y="-15%" width="116%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A4A7A" flood-opacity="0.12"/></filter></defs>
  <g fill="none" stroke="#648CAE" stroke-width="3" marker-end="url(#arrow)"><path d="M194 100 H217"/><path d="M386 100 H409"/><path d="M578 100 H601"/><path d="M770 100 H793"/><path d="M962 100 H985"/></g>
  <g filter="url(#shadow)" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
    <g><rect x="25" y="35" width="169" height="130" rx="14" fill="#EAF4FB" stroke="#76A7CA"/><text x="109" y="72" text-anchor="middle" fill="#0A4A7A" font-size="18" font-weight="700">1　讀需求</text><text x="109" y="106" text-anchor="middle" fill="#34506B" font-size="15">要解決什麼？</text><text x="109" y="130" text-anchor="middle" fill="#34506B" font-size="14">範圍與限制是什麼？</text></g>
    <g><rect x="217" y="35" width="169" height="130" rx="14" fill="#FFF8E9" stroke="#E6B34C"/><text x="301" y="72" text-anchor="middle" fill="#A94712" font-size="18" font-weight="700">2　提出計畫</text><text x="301" y="106" text-anchor="middle" fill="#66513A" font-size="15">讓 AI 建議</text><text x="301" y="130" text-anchor="middle" fill="#66513A" font-size="14">或做一個小修改</text></g>
    <g><rect x="409" y="35" width="169" height="130" rx="14" fill="#EAF4FB" stroke="#76A7CA"/><text x="493" y="72" text-anchor="middle" fill="#0A4A7A" font-size="18" font-weight="700">3　看 diff</text><text x="493" y="106" text-anchor="middle" fill="#34506B" font-size="15">改了哪些檔案？</text><text x="493" y="130" text-anchor="middle" fill="#34506B" font-size="14">有沒有超出範圍？</text></g>
    <g><rect x="601" y="35" width="169" height="130" rx="14" fill="#FFF8E9" stroke="#E6B34C"/><text x="685" y="72" text-anchor="middle" fill="#A94712" font-size="18" font-weight="700">4　執行驗證</text><text x="685" y="106" text-anchor="middle" fill="#66513A" font-size="15">測試、範例輸入</text><text x="685" y="130" text-anchor="middle" fill="#66513A" font-size="14">DOMjudge 或手動檢查</text></g>
    <g><rect x="793" y="35" width="169" height="130" rx="14" fill="#EAF4FB" stroke="#76A7CA"/><text x="877" y="72" text-anchor="middle" fill="#0A4A7A" font-size="18" font-weight="700">5　自己解釋</text><text x="877" y="106" text-anchor="middle" fill="#34506B" font-size="15">為什麼正確？</text><text x="877" y="130" text-anchor="middle" fill="#34506B" font-size="14">邊界情況是什麼？</text></g>
    <g><rect x="985" y="35" width="169" height="130" rx="14" fill="#FFF8E9" stroke="#E6B34C"/><text x="1069" y="72" text-anchor="middle" fill="#A94712" font-size="18" font-weight="700">6　Git commit</text><text x="1069" y="106" text-anchor="middle" fill="#66513A" font-size="15">保留確認過的</text><text x="1069" y="130" text-anchor="middle" fill="#66513A" font-size="14">可回溯版本</text></g>
  </g>
  <text x="590" y="206" text-anchor="middle" fill="#647D96" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="14">AI 產出是候選方案；驗證、理解與版本紀錄才是完成</text>
</svg>
